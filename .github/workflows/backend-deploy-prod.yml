name: Backend — Deploy Produção

# Dispara a partir de uma GitHub Release publicada. Como frontend e
# backend compartilham o mesmo repositório/evento `release: published`,
# cada job verifica o prefixo da tag (`backend-v*`) antes de fazer
# qualquer coisa — sem esse guard, uma release do frontend (`vX.Y.Z`)
# também dispararia (e falharia, publicando código errado) este
# pipeline, e vice-versa (ver
# backend/specs/FEAT-14-cicd-github-actions/plan.md, decisão 5).
#
# Path-filtrado via job check-changes (mesmo padrão de
# backend-deploy-account-trigger-prod.yml, ver comentário lá pro porquê
# de não dar pra usar `paths:` nativo com o evento `release`) — evita
# redeployar a Api quando a release só trouxe mudança isolada em
# GastosApp.CognitoTriggers (Lambda separado, seu próprio workflow).
# Achado real: até esta correção, toda release backend-v* redeployava a
# Api incondicionalmente, mesmo sem nenhuma mudança relevante a ela.
on:
  release:
    types: [published]

permissions:
  id-token: write # necessário para autenticação AWS via OIDC (sem access key fixa)
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  check-changes:
    if: startsWith(github.event.release.tag_name, 'backend-v')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo — necessário pro git diff entre tags

      - name: Verificar se algo relevante à Api mudou desde a última release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          previous_tag=$(gh release list --exclude-drafts --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("backend-v")) | select(.tagName != "${{ github.event.release.tag_name }}")] | sort_by(.publishedAt) | last | .tagName // ""')

          if [ -z "$previous_tag" ]; then
            echo "Nenhuma release anterior do backend publicada — primeiro deploy deste Lambda, considera mudou."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparando $previous_tag..${{ github.event.release.tag_name }}"

          # Paths relativos a backend/ (não repo-root) — o `defaults.run.working-directory`
          # deste workflow já executa dentro de backend/, então um prefixo "backend/"
          # aqui apontaria para backend/backend/... (inexistente) e o diff daria sempre
          # vazio. Achado real: foi exatamente isso que aconteceu na release backend-v0.0.7.
          changed_paths=$(git diff --name-only "$previous_tag" "${{ github.event.release.tag_name }}" -- \
            src/GastosApp.Api \
            src/GastosApp.Application \
            src/GastosApp.Domain \
            src/GastosApp.Infrastructure \
            infra/lambda/Dockerfile.build \
            infra/lambda/build.sh \
            GastosApp.sln || true)

          if [ -n "$changed_paths" ]; then
            echo "Mudanças relevantes encontradas:"
            echo "$changed_paths"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhuma mudança relevante à Api desde $previous_tag."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    needs: check-changes
    if: needs.check-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet build GastosApp.sln -c Release
      - run: dotnet test GastosApp.sln -c Release

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment: backend-prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build do artefato (Native AOT)
        run: bash infra/lambda/build.sh

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CICD_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publicar código na Lambda (prod)
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.FUNCTION_NAME }}" \
            --zip-file fileb://infra/lambda/function.zip \
            --publish
          aws lambda wait function-updated --function-name "${{ vars.FUNCTION_NAME }}"

      - name: Atualizar variáveis de versão na Lambda (prod)
        run: |
          current=$(aws lambda get-function-configuration \
            --function-name "${{ vars.FUNCTION_NAME }}" \
            --query 'Environment.Variables' --output json)

          merged=$(echo "$current" | jq -c \
            --arg version "${{ github.event.release.tag_name }}" \
            --arg commit "${{ github.sha }}" \
            '. + {APP_VERSION: $version, APP_COMMIT_SHA: $commit, APP_ENVIRONMENT: "prod"}')

          # --environment precisa de JSON puro ({"Variables": {...}}) —
          # o prefixo "Variables=" faz o AWS CLI tentar interpretar como
          # shorthand syntax, que não entende JSON aninhado (mesmo
          # achado do backend-deploy-hom.yml).
          environment_json=$(jq -n --argjson vars "$merged" '{Variables: $vars}')

          aws lambda update-function-configuration \
            --function-name "${{ vars.FUNCTION_NAME }}" \
            --environment "$environment_json"
          aws lambda wait function-updated --function-name "${{ vars.FUNCTION_NAME }}"

  # Mantém main sempre refletindo o que está de fato em produção (mesmo
  # princípio da FEAT-10 do frontend). Idempotente e convive com o job
  # equivalente do frontend: como o par de branches é o mesmo
  # (develop → main), o `existing` checado abaixo já reflete um PR
  # aberto por qualquer um dos dois lados, nunca duplica.
  #
  # Roda em dois cenários — nunca quando quality/deploy falharam de
  # verdade:
  # - changed=true: só depois que deploy terminou com sucesso (mesmo
  #   comportamento de antes do job check-changes existir).
  # - changed=false: quality/deploy são pulados de propósito (nenhuma
  #   mudança relevante à Api nesta release), mas a release em si foi
  #   publicada — main ainda deve avançar pra refletir isso, senão o PR
  #   develop → main nunca abriria numa release que só tocou
  #   GastosApp.CognitoTriggers.
  open-pr-main:
    needs: [check-changes, deploy]
    if: always() && needs.check-changes.result == 'success' && (needs.check-changes.outputs.changed != 'true' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Abrir PR develop → main (se ainda não existir)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # main pode já refletir develop nesse ponto (ex.: PR anterior
          # já mesclado manualmente, ou pelo job equivalente do
          # frontend, que mira o mesmo par de branches) — nesse caso a
          # API do GitHub recusa criar um PR sem diff, então checamos
          # antes de tentar.
          ahead=$(gh api "repos/${{ github.repository }}/compare/main...develop" --jq '.ahead_by')
          if [ "$ahead" -eq 0 ]; then
            echo "main já reflete develop (nenhum commit novo), nada a fazer."
            exit 0
          fi

          existing=$(gh pr list --head develop --base main \
            --state open --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh pr create --base main --head develop \
              --title "Release ${{ github.event.release.tag_name }} → main" \
              --body "Aberto automaticamente após deploy de produção do backend bem-sucedido (release \`${{ github.event.release.tag_name }}\`)."
          else
            echo "PR develop → main já existe, nada a fazer."
          fi
