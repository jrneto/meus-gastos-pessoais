name: Frontend — PR automático para develop

# Dispara em push em branch de Fluxo Completo (convenção: nomeada
# como a pasta de spec, ex.: FEAT-11-nome-feature — ver /CLAUDE.md
# raiz) ou de Modo Leve (prefixo fix/*, ex.: fix/nome-do-bug), só
# quando o app do frontend muda. Se o gate de qualidade passar, abre
# um PR pra develop automaticamente (idempotente — não duplica em
# pushes seguintes). Merge continua sempre manual.
on:
  push:
    branches: ['FEAT-*', 'fix/*']
    paths:
      - 'frontend/app/**'

defaults:
  run:
    working-directory: frontend/app

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test

  open-pr:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # só este job precisa — quality fica só com contents: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Abrir PR para develop (se ainda não existir)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --head "${{ github.ref_name }}" --base develop \
            --state open --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh pr create --base develop --head "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --body "Aberto automaticamente pelo gate de qualidade (frontend-feature-pr.yml) — FEAT-10."
          else
            echo "PR já existe para ${{ github.ref_name }} → develop, nada a fazer."
          fi
