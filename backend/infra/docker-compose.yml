# Ambiente local do backend GastosApp, sem dependência de AWS real
# (FEAT-18). LocalStack (Community, gratuito) emula DynamoDB e SSM
# Parameter Store; cognito-local emula o Cognito, que não está
# disponível na edição Community do LocalStack. A API .NET roda fora
# do Docker (dotnet run), apontando para estes dois serviços via
# appsettings.Development.json.
#
# Uso: docker compose up -d && ./scripts/local-init.sh
# Detalhes em backend/infra/README.md.

networks:
  # Rede nomeada explicitamente (em vez do default implícito
  # "<pasta>_default" do Compose) — localstack e cognito-local
  # conversam entre si por ela, e o container do teste integrado local
  # (FEAT-29, infra/lambda/run-local.sh) precisa alcançar
  # "gastosapp-localstack" pelo nome. Esse container não se anexa a ela
  # diretamente (ver comentário em "ports" do cognito-local abaixo) —
  # herda o acesso por rodar no mesmo namespace de rede do cognito-local.
  gastosapp-local:
    name: gastosapp-local

services:
  localstack:
    image: localstack/localstack:4
    container_name: gastosapp-localstack
    environment:
      - SERVICES=dynamodb,ssm
      - DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./.localstack:/var/lib/localstack
    networks:
      - gastosapp-local

  cognito-local:
    build:
      context: ./cognito-local
    container_name: gastosapp-cognito-local
    environment:
      # cognito-local só lê hostname/porta de bind de HOST/PORT (env vars),
      # não do config.json — precisa de 0.0.0.0 pra aceitar conexões de
      # fora do container (o config.json fixa o IssuerDomain em
      # localhost:9229, que é o que importa pra validação do JWT).
      - HOST=0.0.0.0
      - PORT=9229
    ports:
      - "9229:9229"
      # Não usado por este container — reservado para o container do
      # teste integrado local (FEAT-29, infra/lambda/run-local.sh), que
      # roda com --network container:gastosapp-cognito-local (namespace
      # de rede compartilhado, não só a mesma rede Docker). Necessário
      # porque config.json fixa IssuerDomain em "localhost:9229": o
      # discovery document do Cognito real (e do cognito-local) devolve
      # jwks_uri/issuer usando esse valor literal, então só resolve
      # corretamente de dentro do MESMO namespace de rede — Docker não
      # permite sobrescrever "localhost" via --add-host (testado/
      # confirmado durante a implementação da FEAT-29). Publicar a porta
      # aqui é o que permite o host alcançar, via localhost:9000, o RIE
      # que o outro container liga na porta 8080 desse mesmo namespace.
      - "9000:8080"
    volumes:
      - ./.cognito-local:/app/.cognito
    networks:
      - gastosapp-local
