# DOCKER COMPOSE PARA AMBIENTE DE DESENVOLVIMENTO LOCAL - GASTOSAPP
# Configurado para desenvolvimento local conectado diretamente à nuvem AWS real.

services:
  # API ASP.NET Core 10 (Minimal APIs)
  api:
    image: gastosapp-api:latest
    container_name: gastosapp-api
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AWS__Region=us-east-1
      - AWS_PROFILE=developer # Usa o profile conectado via AWS CLI / Identity Center
    volumes:
      # 🔒 Compartilha as credenciais temporárias do seu computador com o container de forma segura
      - ~/.aws:/root/.aws:ro
    networks:
      - gastos-network

  # API Gateway Kong rodando em modo DB-less (sem banco de dados)
  kong:
    image: kong:3.9.3
    container_name: gastosapp-kong
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/etc/kong/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      # Monta a configuração declarativa de rotas do Kong (somente leitura)
      - ./kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      - api
    networks:
      - gastos-network

networks:
  gastos-network:
    driver: bridge