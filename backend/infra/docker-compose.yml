# Ambiente local do backend GastosApp, sem dependência de AWS real
# (FEAT-18). LocalStack (Community, gratuito) emula DynamoDB e SSM
# Parameter Store; cognito-local emula o Cognito, que não está
# disponível na edição Community do LocalStack. A API .NET roda fora
# do Docker (dotnet run), apontando para estes dois serviços via
# appsettings.Development.json.
#
# Uso: docker compose up -d && ./scripts/local-init.sh
# Detalhes em backend/infra/README.md.

networks:
  # Rede nomeada explicitamente (em vez do default implícito
  # "<pasta>_default" do Compose) — o container do teste integrado local
  # (FEAT-29, infra/lambda/run-local.sh) não faz parte deste
  # docker-compose.yml, mas precisa entrar nesta mesma rede pra resolver
  # "gastosapp-localstack"/"gastosapp-cognito-local" pelo nome.
  gastosapp-local:
    name: gastosapp-local

services:
  localstack:
    image: localstack/localstack:4
    container_name: gastosapp-localstack
    environment:
      - SERVICES=dynamodb,ssm
      - DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./.localstack:/var/lib/localstack
    networks:
      - gastosapp-local

  cognito-local:
    build:
      context: ./cognito-local
    container_name: gastosapp-cognito-local
    environment:
      # cognito-local só lê hostname/porta de bind de HOST/PORT (env vars),
      # não do config.json — precisa de 0.0.0.0 pra aceitar conexões de
      # fora do container (o config.json fixa o IssuerDomain em
      # localhost:9229, que é o que importa pra validação do JWT).
      - HOST=0.0.0.0
      - PORT=9229
    ports:
      - "9229:9229"
    volumes:
      - ./.cognito-local:/app/.cognito
    networks:
      - gastosapp-local
